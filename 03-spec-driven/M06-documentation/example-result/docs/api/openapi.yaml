openapi: 3.1.0
info:
  title: todo-app API
  version: 1.0.0
  description: |
    할 일을 조회·추가·완료·삭제하는 HTTP API입니다. 요청과 응답 본문은 모두 JSON입니다.
    오류가 나면 상태 코드와 함께 `error.code`(기계용)와 `error.message`(사람용)를 돌려줍니다.
  license:
    name: MIT
    identifier: MIT
# 인증이 없는 API임을 명시한다.
security: []
servers:
  - url: http://localhost:3000
    description: 로컬 개발 서버 (`npm start`)
tags:
  - name: todos
    description: 할 일
paths:
  /todos:
    get:
      operationId: listTodos
      summary: 할 일 목록 조회
      description: 저장된 할 일 전체를 추가된 순서대로 돌려줍니다. (REQ-010)
      tags: [todos]
      responses:
        "200":
          description: 할 일 목록. 비어 있으면 빈 배열입니다.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Todo"
              example:
                - id: 1
                  title: 우유 사기
                  done: true
                - id: 2
                  title: 책 읽기
                  done: false
    post:
      operationId: createTodo
      summary: 할 일 추가
      description: 새 할 일을 미완료 상태로 목록 끝에 추가합니다. 번호는 기존 번호 중 가장 큰 값 + 1입니다. (REQ-001, REQ-002, REQ-003)
      tags: [todos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewTodo"
            example:
              title: 우유 사기
      responses:
        "201":
          description: 추가된 할 일
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
              example:
                id: 1
                title: 우유 사기
                done: false
        "400":
          description: 제목이 비어 있거나(`EMPTY_TITLE`) 본문이 올바른 JSON이 아님(`INVALID_JSON`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: EMPTY_TITLE
                  message: 제목은 비어 있을 수 없습니다.
  /todos/{id}/done:
    post:
      operationId: completeTodo
      summary: 할 일 완료 처리
      description: 지정한 번호의 할 일만 완료 상태로 바꿉니다. 이미 완료된 할 일이면 그대로 둡니다. (REQ-004, REQ-005, REQ-011)
      tags: [todos]
      parameters:
        - $ref: "#/components/parameters/TodoId"
      responses:
        "200":
          description: 완료 처리된 할 일
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
              example:
                id: 1
                title: 우유 사기
                done: true
        "400":
          description: 번호가 1 이상의 정수가 아님 (REQ-011)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: INVALID_ID
                  message: 번호는 1 이상의 정수여야 합니다.
        "404":
          description: 해당 번호의 할 일이 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: NOT_FOUND
                  message: 99번 할 일을 찾을 수 없습니다.
  /todos/{id}:
    delete:
      operationId: deleteTodo
      summary: 할 일 삭제
      description: 지정한 번호의 할 일을 목록에서 완전히 지웁니다. 복구할 수 없으며, 지운 번호는 다시 쓰일 수 있습니다(ADR-0002). (REQ-012, REQ-013)
      tags: [todos]
      parameters:
        - $ref: "#/components/parameters/TodoId"
      responses:
        "204":
          description: 삭제됨. 응답 본문이 없습니다.
        "400":
          description: 번호가 1 이상의 정수가 아님 (REQ-011)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: INVALID_ID
                  message: 번호는 1 이상의 정수여야 합니다.
        "404":
          description: 해당 번호의 할 일이 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: NOT_FOUND
                  message: 99번 할 일을 찾을 수 없습니다.
components:
  parameters:
    TodoId:
      name: id
      in: path
      required: true
      description: 할 일 번호 (1 이상의 정수)
      schema:
        type: integer
        minimum: 1
  schemas:
    Todo:
      type: object
      required: [id, title, done]
      properties:
        id:
          type: integer
          minimum: 1
          description: 할 일 번호
        title:
          type: string
          minLength: 1
          description: 앞뒤 공백을 지운 제목
        done:
          type: boolean
          description: 완료 여부
    NewTodo:
      type: object
      required: [title]
      properties:
        title:
          type: string
          description: 제목. 앞뒤 공백은 지워서 저장합니다.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [EMPTY_TITLE, INVALID_ID, INVALID_JSON, NOT_FOUND, ROUTE_NOT_FOUND]
              description: 오류 종류 (프로그램이 분기할 때 사용)
            message:
              type: string
              description: 사람이 읽을 오류 설명
